naftiko: 1.0.0-alpha2
info:
  label: Wiktionary MediaWiki Core REST API — Search
  description: 'MediaWiki Core REST API — Search. 2 operations. Lead operation: Wiktionary Search Page. Self-contained Naftiko capability covering one Wiktionary business surface.'
  tags:
  - Wiktionary
  - MediaWiki Core REST API
  - Search
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
- namespace: env
  keys:
    WIKTIONARY_MEDIAWIKI_CORE_TOKEN: WIKTIONARY_MEDIAWIKI_CORE_TOKEN
capability:
  consumes:
  - type: http
    namespace: core-rest-api-search
    baseUri: https://en.wiktionary.org/w/rest.php
    description: Wiktionary MediaWiki Core REST API — Search business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.WIKTIONARY_MEDIAWIKI_CORE_TOKEN}}'
    resources:
    - name: v1-search-page
      path: /v1/search/page
      operations:
      - name: searchPage
        method: GET
        description: Wiktionary Search Page
        inputParameters:
        - name: q
          in: query
          type: string
          required: true
          description: Search query string.
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results to return (1-100, default 50).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-search-title
      path: /v1/search/title
      operations:
      - name: searchTitle
        method: GET
        description: Wiktionary Search Title
        inputParameters:
        - name: q
          in: query
          type: string
          required: true
          description: Title prefix to autocomplete.
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results to return.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: core-rest-api-search-rest
    port: 8080
    description: REST adapter for Wiktionary MediaWiki Core REST API — Search. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/search/page
      name: v1-search-page
      description: REST surface for Wiktionary Search Page.
      operations:
      - method: GET
        name: searchPage
        description: Wiktionary Search Page
        call: core-rest-api-search.searchPage
        with:
          q: rest.q
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/search/title
      name: v1-search-title
      description: REST surface for Wiktionary Search Title.
      operations:
      - method: GET
        name: searchTitle
        description: Wiktionary Search Title
        call: core-rest-api-search.searchTitle
        with:
          q: rest.q
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-rest-api-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for Wiktionary MediaWiki Core REST API — Search. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: search-page
      description: Wiktionary Search Page
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-rest-api-search.searchPage
      with:
        q: tools.q
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: search-title
      description: Wiktionary Search Title
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-rest-api-search.searchTitle
      with:
        q: tools.q
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
