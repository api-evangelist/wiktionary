  - name: Wikimedia REST API (Wiktionary)
    description: >-
      The Wikimedia REST API (the older "RESTBase" service) is hosted per
      project at /api/rest_v1/ and includes Wiktionary-specific endpoints such
      as /page/definition/{term} which returns multilingual structured
      definitions parsed from wikitext, plus generic page endpoints
      (/page/html/{title}, /page/summary/{title}, /page/title/{title},
      /page/mobile-html/{title}) and Parsoid transform endpoints
      (/transform/html/to/wikitext, /transform/wikitext/to/html,
      /transform/wikitext/to/lint). Capped at ~200 req/s, requires a unique
      User-Agent.
    humanURL: https://en.wiktionary.org/api/rest_v1/
    baseURL: https://en.wiktionary.org/api/rest_v1
    tags:
      - Dictionaries
      - Definitions
      - REST
      - Parsoid
