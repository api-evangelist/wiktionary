  Wikimedia Foundation, the dictionary sibling of Wikipedia. Programmatic access
  is exposed through the MediaWiki Action API at en.wiktionary.org/w/api.php,
  the older Wikimedia REST API at en.wiktionary.org/api/rest_v1/ (which provides
  Wiktionary-specific endpoints like /page/definition/{term}), and the newer
  MediaWiki Core REST API at en.wiktionary.org/w/rest.php. All Wiktionary
  content is licensed CC BY-SA 4.0 (and GFDL) and hosted by the Wikimedia
  Foundation.
