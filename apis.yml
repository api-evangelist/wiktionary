  - name: MediaWiki Core REST API (Wiktionary)
    description: >-
      The newer MediaWiki Core REST API is exposed at /w/rest.php on every
      wiki. It offers a smaller, more streamlined surface than the Action API
      for fetching pages, history, search, files, and revisions. On Wiktionary
      it serves the same content as the Action API in a more developer-friendly
      JSON shape. Endpoints include /v1/page/{title}, /v1/page/{title}/html,
      /v1/page/{title}/history, /v1/search/page, /v1/search/title,
      /v1/file/{title}.
    humanURL: https://en.wiktionary.org/w/rest.php/v1
    baseURL: https://en.wiktionary.org/w/rest.php
    tags:
      - Dictionaries
      - REST
      - MediaWiki Core
