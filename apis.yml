apis:
  - name: MediaWiki Action API (Wiktionary)
    description: >-
      The MediaWiki Action API is the original Wikimedia query/edit API exposed
      at /w/api.php on every Wikimedia project. For Wiktionary it provides
      access to wikitext definitions, page parsing, full-text search, and
      OpenSearch suggestions. Actions include action=query (prop=wikitext,
      prop=extracts, prop=revisions, list=search), action=parse (rendered
      wikitext HTML and section trees), action=opensearch (suggestions), and
      action=expandtemplates. Supports both GET and POST with format=json|xml.
    humanURL: https://en.wiktionary.org/w/api.php
    baseURL: https://en.wiktionary.org/w/api.php
    tags:
      - Dictionaries
      - MediaWiki
      - Wikitext
