  - type: Features
    data:
      - name: Multilingual Definitions
        description: >-
          /page/definition/{term} returns dictionary entries broken down by
          source language, part of speech, definitions, and usage examples in
          structured JSON.
      - name: Wikitext Access
        description: >-
          action=query&prop=wikitext returns raw wikitext for any page,
          enabling clients to build their own parsers and extractors.
      - name: Rendered HTML
        description: >-
          /page/html/{title} and action=parse return Parsoid-generated HTML
          suitable for direct rendering in client apps.
      - name: OpenSearch Suggestions
        description: >-
          action=opensearch implements the OpenSearch suggestions protocol so
          Wiktionary can power autocomplete in any search UI.
      - name: Full-Text Search
        description: >-
          action=query&list=search and /v1/search/page expose the same
          ElasticSearch-backed full-text search Wiktionary uses internally.
      - name: Page Revisions and History
        description: >-
          Both APIs expose full revision history, supporting time-travel reads
          and change-detection workflows.
      - name: Wikitext ↔ HTML Transforms
        description: >-
          Parsoid /transform/* endpoints convert between wikitext and HTML
          round-trip-safely, useful for visual editors and bots.
      - name: OAuth 2.0 and BotPasswords
        description: >-
          Authenticated calls support OAuth 2.0 (via api.wikimedia.org), legacy
          OAuth 1.0a, and BotPassword scoped credentials.
      - name: CC BY-SA 4.0 License
        description: >-
          All Wiktionary content can be reused for any purpose with attribution
          and share-alike, including in commercial AI training corpora.
  - type: UseCases
    data:
      - name: Dictionary Apps
        description: >-
          Embed definitions, etymologies, pronunciations, and translations
          directly into mobile or desktop dictionary apps.
      - name: Language-Learning Tools
        description: >-
          Power vocabulary lookups, flashcards, and reading-assistance browser
          extensions for learners of any language.
      - name: NLP and Linguistics Datasets
        description: >-
          Use bulk wikitext dumps and the definition API to build morphology,
          inflection, and word-sense datasets for NLP research.
      - name: Translation Memory
        description: >-
          Mine cross-language Wiktionary translation tables to seed bilingual
          dictionaries and translation memories.
      - name: Spell-Checkers and Tokenizers
        description: >-
          Use the OpenSearch and search endpoints to validate word existence
          and segment text in tokenizers.
      - name: AI Grounding and RAG
        description: >-
          Retrieve authoritative definitions to ground LLM responses about word
          meaning, etymology, and usage.
      - name: Crossword and Game Generation
        description: >-
          Generate clues, anagrams, and puzzle answers from Wiktionary's
          definitions and word lists.
      - name: Linguistic Research
        description: >-
          Query etymologies, declensions, pronunciations, and historical usage
          across hundreds of languages.
  - type: Integrations
    data:
      - name: Wikipedia
        description: >-
          Shares infrastructure, accounts, and most APIs with Wikipedia; both
          run on MediaWiki under the Wikimedia Foundation.
      - name: Wikidata
        description: >-
          Wiktionary lexemes are increasingly linked to structured Wikidata
          lexeme entities (Lexeme namespace, Q-IDs, L-IDs).
      - name: Wikimedia Commons
        description: >-
          Pronunciation audio files and images embedded in Wiktionary pages
          live on Commons and are reachable via the same APIs.
      - name: Pywikibot
        description: >-
          The reference bot framework for automated edits, dumps, and
          maintenance scripts against Wiktionary.
      - name: Wikimedia Enterprise
        description: >-
          Commercial high-volume snapshots of Wikimedia content (Wikipedia
          first, with broader project coverage expanding); useful when REST
          rate limits are insufficient.
      - name: Toolforge
        description: >-
          Wikimedia-hosted PaaS for community tools that consume the
          Wiktionary APIs at scale without bringing your own infrastructure.
      - name: Hugging Face Datasets
        description: >-
          Pre-processed Wiktionary dumps are available on Hugging Face for
          immediate use in ML training pipelines.
  - type: Solutions
    data:
      - name: Free Public APIs
        description: >-
          The MediaWiki Action API, Wikimedia REST API, and MediaWiki Core
          REST API are all free to use without registration, subject to the
          200 req/s shared limit and User-Agent requirement.
      - name: Bulk Dumps
        description: >-
          dumps.wikimedia.org provides full XML and SQL exports of every
          Wikimedia project, refreshed at least monthly; the preferred channel
          for whole-corpus processing.
      - name: Wikimedia Enterprise
        description: >-
          Paid SLA-backed snapshots and streaming APIs for commercial reusers
          who need throughput, freshness, or attribution guarantees beyond
          what the free APIs provide.
